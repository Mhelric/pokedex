<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/retro-ui.css">
    <link rel="stylesheet" href="styles/animations.css">

</head>
<body>
    <header>
        <h1>Pokédex</h1>
    </header>

    <main id="app">
        <!-- Controls: Search Bar and Type Filter -->
         <section>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search by name or ID (e.g., Pikachu, 25)..." required
                />
                <button type="submit">Search</button>
            </form>
         </section>
        
        <!-- Dynamic Grid Container -->
         <section id="pokemon-grid" class="pokemon-grid">
            <!-- Dynamic cards will be rendered here -->
         </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
