<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pokédex</title>
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/retro-ui.css">
    <link rel="stylesheet" href="styles/animations.css">

</head>
<body>
    <header>
        <h1>Pokédex</h1>
    </header>

    <main id="app">
        <!-- Controls: Search Bar and Type Filter -->
         <section class="controls">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search by name or ID (e.g., Pikachu, 25)..." required
                />
                <button type="submit">Search</button>
                <!-- Type Filter Bar -->
                <div class="type-select-container">
                    <select id="type-select-dropdown" class="type-dropdown">
                        <option value="all">🌐 All Types</option>
                        <option value="normal">⚪ Normal</option>
                        <option value="fire">🔥 Fire</option>
                        <option value="water">💧 Water</option>
                        <option value="grass">🌿 Grass</option>
                        <option value="electric">⚡ Electric</option>
                        <option value="ice">❄️ Ice</option>
                        <option value="fighting">🥊 Fighting</option>
                        <option value="poison">☠️️ Poison</option>
                        <option value="ground">🏜️ Ground</option>
                        <option value="flying">🕊️ Flying</option>
                        <option value="psychic">🔮 Psychic</option>
                        <option value="bug">🐛 Bug</option>
                        <option value="rock">🪨 Rock</option>
                        <option value="ghost">👻 Ghost</option>
                        <option value="dragon">🐉 Dragon</option>
                        <option value="steel">⚙️ Steel</option>
                        <option value="fairy">✨ Fairy</option>
                        <option value="dark">🌙 Dark</option>
                    </select>
                </div>
                <!-- Toggle Button -->
                <button type="button" id="sprite-toggle-btn" class="btn-secondary">
                    Mode: Animated GIFs
                </button>
            </form>
         </section>
         
        <!-- Dynamic Grid Container -->
         <section id="pokemon-grid" class="pokemon-grid">
            <!-- Dynamic cards will be rendered here -->
         </section>

<!-- Mini-Game Section -->
         <section id="minigame-section" class="minigame-section">
            <div class="game-header">
                <h2>Who's That Pokémon?</h2>
                <div class="game-score">
                    <span>Streak: <strong id="streak-count">0</strong></span> |
                    <span>Best: <strong id="highscore-count">0</strong></span>
                </div>
            </div>
            <div class="game-card">
                <div class="silhoutte-container">
                    <img id="game-pokemon-img" class="silhoutte" src="" alt="Mystery Pokemon" />
                </div>
                <div id="game-feedback" class="game-feedback">
                    Guess the Pokémon!
                </div>
                <div id="game-options" class="game-options">
                    <!-- 4 Multiple Choice Buttons will render here -->
                </div>
                <button id="next-pokemon-btn" class="btn-primary" style="display: none">Next Pokemon</button>
            </div>
         </section>

         <!-- Team Builder Banner / Section -->
         <section id="team-section" class="team-section">
            <div class="team-header">
                <h2>My Team (<span id="team-count">0</span>/6)</h2>
                <button id="clear-team-btn" class="btn-secondary">Clear team</button>
            </div>
            <div id="team-grid" class="team-grid">
                <!-- Dynamic team slot cards will be rendered here -->
            </div>
         </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
